name: clouddroid
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: clouddroid
      POSTGRES_DB: clouddroid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddroid"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clouddroid:${POSTGRES_PASSWORD}@127.0.0.1:15432/clouddroid
      RUNTIME_ENABLED: "true"
    # Native WebRTC needs host ICE candidates. Use TURN for cloud NAT/mobile networks.
    network_mode: host
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set production hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]
volumes:
  postgres:
  caddy_data:
  caddy_config:
